<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH桌面通知 · 效果演示</title>
<style>
  :root {
    --taskbar: rgba(28, 28, 32, 0.86);
    --toast-bg: rgba(38, 38, 44, 0.94);
    --toast-border: rgba(255, 255, 255, 0.08);
    --text: #f2f3f5;
    --muted: #b6b8bf;
    --accent: #f0a020;
    --ok: #35c07f;
    --badge: #f5455c;
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 18% 12%, #2b4a7a 0%, transparent 60%),
      radial-gradient(900px 600px at 82% 8%, #6b3f7a 0%, transparent 55%),
      radial-gradient(1000px 800px at 60% 100%, #12324a 0%, transparent 60%),
      linear-gradient(160deg, #0d1420 0%, #101a26 45%, #0a1017 100%);
  }

  /* A quiet hint of a desktop behind the notification. */
  .wallpaper-word {
    position: fixed;
    left: 48px;
    bottom: 96px;
    font-size: 15px;
    letter-spacing: 0.3em;
    color: rgba(255, 255, 255, 0.16);
    text-transform: uppercase;
  }

  .hint {
    position: fixed;
    left: 48px;
    top: 40px;
    max-width: 520px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 14px;
    line-height: 1.7;
  }
  .hint h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
  .hint p { margin: 0; color: rgba(255, 255, 255, 0.55); }
  .hint kbd {
    font: inherit;
    padding: 1px 6px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.16);
  }

  /* ------------------------------------------------------------- toast */
  .toast-stack {
    position: fixed;
    right: 20px;
    bottom: 72px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-end;
  }

  .toast {
    width: 372px;
    padding: 14px 14px 14px 12px;
    display: grid;
    grid-template-columns: 44px 1fr 24px;
    gap: 12px;
    align-items: start;
    border-radius: 10px;
    background: var(--toast-bg);
    border: 1px solid var(--toast-border);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(22px) saturate(140%);
    transform-origin: bottom right;
    opacity: 0;
    transform: translateY(18px) scale(0.98);
    transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .toast.visible { opacity: 1; transform: none; }
  .toast.leaving { opacity: 0; transform: translateY(8px) scale(0.99); }

  .toast img { width: 44px; height: 44px; border-radius: 10px; display: block; }

  .toast .title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 2px;
  }
  .toast .body {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .toast .meta {
    margin-top: 6px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.38);
  }
  .toast .close {
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 6px;
    color: rgba(255, 255, 255, 0.6);
    background: transparent;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .toast .close:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

  /* ----------------------------------------------------------- taskbar */
  .taskbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--taskbar);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(28px) saturate(150%);
  }

  .task-icon {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.06);
  }
  .task-icon img { width: 26px; height: 26px; border-radius: 6px; }
  .task-icon.dsh { background: rgba(77, 107, 254, 0.22); box-shadow: inset 0 0 0 1px rgba(120, 150, 255, 0.32); }
  .task-icon.dsh::after {
    content: "";
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 3px;
    border-radius: 2px;
    background: #7aa2ff;
  }

  .badge {
    position: absolute;
    right: 1px;
    bottom: 2px;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 9px;
    background: var(--badge);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    line-height: 18px;
    text-align: center;
    border: 2px solid rgba(18, 18, 22, 0.92);
    transform: scale(0);
    transition: transform 0.18s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .badge.visible { transform: scale(1); }

  /* The overlay Windows paints on the taskbar button, shown at real size. */
  .overlay-demo {
    position: fixed;
    right: 26px;
    bottom: 70px;
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
  }
  .overlay-demo img { width: 32px; height: 32px; }

  .controls {
    position: fixed;
    left: 48px;
    bottom: 84px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 620px;
  }
  .controls button {
    font: inherit;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.86);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .controls button:hover { background: rgba(255, 255, 255, 0.14); }

  body.static .hint,
  body.static .controls,
  body.static .wallpaper-word { display: none; }
  body.static .toast { transition: none; }
</style>
</head>
<body>
  <div class="hint">
    <h1>DSH桌面通知</h1>
    <p>最小化 DSH 时，审批请求在桌面右下角弹出；任务完成时任务栏图标挂上角标并响一声。<br />
       点击下方按钮或按 <kbd>空格</kbd> 重放演示；<kbd>?static=1</kbd> 只渲染静态画面，便于截图。</p>
  </div>

  <div class="wallpaper-word">DeepSeek Harness · away alerts</div>

  <div class="toast-stack" id="stack"></div>

  <div class="controls">
    <button data-act="approval">重放：审批通知</button>
    <button data-act="done">重放：任务完成</button>
    <button data-act="both">两个一起</button>
    <button data-act="clear">清空</button>
  </div>

  <div class="taskbar" id="taskbar">
    <div class="task-icon"><img src="../assets/icon-task.png" alt="" /></div>
    <div class="task-icon dsh" id="dshIcon">
      <img src="../assets/icon-180.png" alt="DeepSeek Harness" />
      <span class="badge" id="badge">0</span>
    </div>
    <div class="task-icon"><img src="../assets/icon-approval.png" alt="" /></div>
  </div>

<script>
  const stack = document.getElementById('stack')
  const badge = document.getElementById('badge')
  const body = document.body

  const params = new URLSearchParams(location.search)
  const isStatic = params.get('static') === '1'
  if (isStatic) body.classList.add('static')

  const MESSAGES = {
    approval: {
      icon: '../assets/icon-approval.png',
      title: 'DSH 需要你审批',
      body: 'bash：sandbox escalation 需要你「允许一次」或「拒绝」',
      meta: 'DeepSeek Harness · 现在',
      life: 9000,
    },
    done: {
      icon: '../assets/icon-task.png',
      title: '任务完成',
      body: '《重构登录流程》这一轮已跑完',
      meta: 'DeepSeek Harness · 现在',
      life: 5000,
    },
  }

  function showToast(kind) {
    const spec = MESSAGES[kind]
    const el = document.createElement('div')
    el.className = 'toast'
    el.innerHTML = `
      <img src="${spec.icon}" alt="" />
      <div>
        <p class="title">${spec.title}</p>
        <p class="body">${spec.body}</p>
        <p class="meta">${spec.meta}</p>
      </div>
      <button class="close" aria-label="关闭">×</button>`
    el.querySelector('.close').addEventListener('click', () => dismiss(el))
    stack.appendChild(el)
    requestAnimationFrame(() => el.classList.add('visible'))
    if (!isStatic) setTimeout(() => dismiss(el), spec.life)
    return el
  }

  function dismiss(el) {
    el.classList.remove('visible')
    el.classList.add('leaving')
    setTimeout(() => el.remove(), 220)
  }

  function setBadge(count) {
    badge.textContent = count > 99 ? '99+' : String(count)
    badge.classList.toggle('visible', count > 0)
  }

  function chime() {
    if (isStatic) return
    const AudioCtx = window.AudioContext || window.webkitAudioContext
    if (!AudioCtx) return
    const ctx = new AudioCtx()
    const now = ctx.currentTime
    ;[[880, 0], [1318, 0.13]].forEach(([hz, at]) => {
      const osc = ctx.createOscillator()
      const gain = ctx.createGain()
      osc.type = 'sine'
      osc.frequency.value = hz
      gain.gain.setValueAtTime(0.0001, now + at)
      gain.gain.exponentialRampToValueAtTime(0.18, now + at + 0.02)
      gain.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.3)
      osc.connect(gain).connect(ctx.destination)
      osc.start(now + at)
      osc.stop(now + at + 0.34)
    })
    setTimeout(() => ctx.close(), 900)
  }

  let badgeCount = 0

  function play(act) {
    if (act === 'clear') {
      ;[...stack.children].forEach(dismiss)
      badgeCount = 0
      setBadge(0)
      return
    }
    if (act === 'approval' || act === 'both') {
      showToast('approval')
      chime()
    }
    if (act === 'done' || act === 'both') {
      showToast('done')
      badgeCount += 1
      setBadge(badgeCount)
      chime()
    }
  }

  document.querySelectorAll('[data-act]').forEach((button) => {
    button.addEventListener('click', () => play(button.dataset.act))
  })
  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
      event.preventDefault()
      play('both')
    }
  })

  // Static mode: render the state the screenshot needs, without animation.
  if (isStatic) {
    const state = params.get('state') || 'both'
    if (state === 'approval' || state === 'both') {
      const el = showToast('approval')
      el.style.transition = 'none'
      el.classList.add('visible')
    }
    if (state === 'done' || state === 'both') {
      const el = showToast('done')
      el.style.transition = 'none'
      el.classList.add('visible')
      badgeCount = 3
      setBadge(badgeCount)
    }
  } else {
    // A short automatic run so a screen recording has something to capture.
    setTimeout(() => play('both'), 600)
  }
</script>
</body>
</html>
